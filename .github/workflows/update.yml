name: ATP · WTA Value Bet

on:
  schedule:
    # ── FONTOS: a cron az INDITAS ideje, nem a kesz eredmenye ──────────
    # A GitHub ingyenes utemezoje nem garantal idozitest. 36 futas merese
    # alapjan ennel a reponal a keses MEDIANJA 2 ora 46 perc (16 perc es
    # 5 ora 17 perc kozott szort).  Ezert az alabbi idopontok ~2h45m-mel
    # KORABBRA vannak teve annal, amikor a kesz listat latni szeretnenk,
    # es :13 percre (a teljes ora a legzsufoltabb, azt terheli a GitHub
    # a legjobban — sajat ajanlasuk paratlan percet hasznalni).
    #
    # Celzott KESZ idopont magyar teli ido szerint: 07 / 11 / 15 / 20 ora.
    # Nyari idoben (marc. vege - okt. vege) mindegyik egy oraval kesobb.
    # Ha egy futas nagyon keslekedik, a kovetkezo ugyis potolja —
    # a sticky badge miatt a mar rogzitett jelolesek nem vesznek el.
    - cron: '13 3 * * *'     # ~07:00-ra kesz — reggeli lista + elozo napi eredmenyek
    - cron: '13 7 * * *'     # ~11:00-ra kesz — napi frissites + eredmenyek
    - cron: '13 11 * * *'    # ~15:00-ra kesz — napi frissites
    - cron: '13 16 * * *'    # ~20:00-ra kesz — esti frissites (hajnali meccsek oddsa)
    - cron: '13 5 * * 1'     # hetfo — Elo frissites
    - cron: '13 2 1 1 *'     # jan 1. — CPI eves frissites
  workflow_dispatch:
    inputs:
      bankroll:
        description: 'Bankroll'
        default: '1000'
      force_elo:
        description: 'Elo frissites? (yes/no)'
        default: 'no'
      force_cpi:
        description: 'CPI frissites? (yes/no)'
        default: 'no'
      backfill_days:
        description: 'Eredmeny-visszatoltes N napra (0 = kihagyas)'
        default: '3'
      print_csv:
        description: 'Teljes CSV kiirasa a logba? (yes/no)'
        default: 'no'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}-v7

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Eves CPI frissites
        if: >
          github.event.schedule == '13 2 1 1 *' ||
          github.event.inputs.force_cpi == 'yes'
        run: python fetch_cpi.py

      - name: Heti Elo frissites
        if: >
          github.event.schedule == '13 5 * * 1' ||
          github.event.inputs.force_elo == 'yes'
        run: python fetch_elo.py

      # ── Elozo napi eredmenyek rogzitese ────────────────────────────
      # 7 napra visszamenoleg fut: ha egy nap kimaradt (Actions hiba,
      # keso eredmeny), a kovetkezo futas automatikusan potolja.
      # A mar teljes napokat kihagyja, igy nem terheli feleslegesen a szervert.
      - name: Eredmenyek rogzitese (auto, 7 napra visszamenoleg)
        if: >
          github.event.schedule == '13 3 * * *' ||
          github.event.schedule == '13 7 * * *'
        run: python fetch_results.py --days 7
        continue-on-error: true

      - name: Osszesito statisztika
        if: >
          github.event.schedule == '13 3 * * *' ||
          github.event.schedule == '13 7 * * *'
        run: python fetch_results.py --summary
        continue-on-error: true

      - name: Eredmenyek visszatoltese (extra, kezi inditasnal)
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.backfill_days != '0' &&
          github.event.inputs.backfill_days != ''
        run: python fetch_results.py --days ${{ github.event.inputs.backfill_days }}
        continue-on-error: true

      # ── Napi meccsek + HTML ────────────────────────────────────────
      # MINDEN futasnal lefut (a reggeli 07:00-nal is), igy a lista
      # reggel is friss. A holnap hajnali meccsek is bekerulnek.
      - name: Napi meccsek + HTML
        run: |
          SKIP=""
          [ -f "data/elo_ratings_atp.json" ] && [ -f "data/elo_ratings_wta.json" ] && SKIP="--skip-elo"
          python main.py --bankroll "${{ github.event.inputs.bankroll || '1000' }}" $SKIP

      # A CSV export CSAK kezi inditasnal fut. A forras (data/history/)
      # naponta frissul, igy az export barmikor lekerheto es mindig teljes.
      - name: CSV export (data/history_export.csv)
        if: github.event_name == 'workflow_dispatch'
        run: python export_history.py --quiet
        continue-on-error: true

      # Kezi inditasnal, ha keri: a teljes CSV a logba is kikerul.
      - name: CSV kiiratasa a logba
        if: github.event.inputs.print_csv == 'yes'
        run: python export_history.py
        continue-on-error: true

      - name: Commit es push
        run: |
          git config user.email "action@github.com"
          git config user.name  "GitHub Action"
          git add index.html data/ || true
          git diff --staged --quiet || git commit -m "$(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash || true
          git push

      - name: ntfy ertesites
        if: always()
        run: |
          curl -s \
            -H "Title: ATP WTA Value Bet" \
            -H "Priority: default" \
            -H "Tags: tennis" \
            -H "Click: https://czakopeti.github.io/tennis/" \
            -d "Frissites kesz — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true
