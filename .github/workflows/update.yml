name: ATP · WTA Value Bet

on:
  schedule:
    - cron: '30 5 * * *'     # 05:30 UTC — elozo napi eredmenyek rogzitese
    - cron: '0 7 * * *'      # 07:00 UTC — napi frissites
    - cron: '0 11 * * *'     # 11:00 UTC — napi frissites
    - cron: '0 17 * * *'     # 17:00 UTC — esti frissites (hajnali meccsek oddsa)
    - cron: '0 9 * * 1'      # hetfo 09:00 UTC — Elo frissites
    - cron: '0 6 1 1 *'      # jan 1. — CPI eves frissites
  workflow_dispatch:
    inputs:
      bankroll:
        description: 'Bankroll'
        default: '1000'
      force_elo:
        description: 'Elo frissites? (yes/no)'
        default: 'no'
      force_cpi:
        description: 'CPI frissites? (yes/no)'
        default: 'no'
      backfill_days:
        description: 'Extra eredmeny-visszatoltes N napra (0 = nem kell)'
        default: '0'
      print_csv:
        description: 'Teljes CSV kiirasa a logba? (yes/no)'
        default: 'no'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}-v7

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Eves CPI frissites
        if: >
          github.event.schedule == '0 6 1 1 *' ||
          github.event.inputs.force_cpi == 'yes'
        run: python fetch_cpi.py

      - name: Heti Elo frissites
        if: >
          github.event.schedule == '0 9 * * 1' ||
          github.event.inputs.force_elo == 'yes'
        run: python fetch_elo.py

      # ── Elozo napi eredmenyek rogzitese ────────────────────────────
      # 7 napra visszamenoleg fut: ha egy nap kimaradt (Actions hiba,
      # keso eredmeny), a kovetkezo futas automatikusan potolja.
      # A mar teljes napokat kihagyja, igy nem terheli feleslegesen a szervert.
      - name: Eredmenyek rogzitese (auto, 7 napra visszamenoleg)
        if: github.event.schedule == '30 5 * * *'
        run: python fetch_results.py --days 7
        continue-on-error: true

      - name: Osszesito statisztika (hajnali futas)
        if: github.event.schedule == '30 5 * * *'
        run: python fetch_results.py --summary
        continue-on-error: true

      - name: Eredmenyek visszatoltese (extra, kezi inditasnal)
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.backfill_days != '0' &&
          github.event.inputs.backfill_days != ''
        run: python fetch_results.py --days ${{ github.event.inputs.backfill_days }}
        continue-on-error: true

      # ── Napi meccsek + HTML ────────────────────────────────────────
      - name: Napi meccsek + HTML
        if: github.event.schedule != '30 5 * * *'
        run: |
          SKIP=""
          [ -f "data/elo_ratings_atp.json" ] && [ -f "data/elo_ratings_wta.json" ] && SKIP="--skip-elo"
          python main.py --bankroll "${{ github.event.inputs.bankroll || '1000' }}" $SKIP

      # A CSV export CSAK kezi inditasnal fut. A forras (data/history/)
      # naponta frissul, igy az export barmikor lekerheto es mindig teljes.
      - name: CSV export (data/history_export.csv)
        if: github.event_name == 'workflow_dispatch'
        run: python export_history.py --quiet
        continue-on-error: true

      # Kezi inditasnal, ha keri: a teljes CSV a logba is kikerul.
      - name: CSV kiiratasa a logba
        if: github.event.inputs.print_csv == 'yes'
        run: python export_history.py
        continue-on-error: true

      - name: Commit es push
        run: |
          git config user.email "action@github.com"
          git config user.name  "GitHub Action"
          git add index.html data/ || true
          git diff --staged --quiet || git commit -m "$(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash || true
          git push

      - name: ntfy ertesites
        if: always()
        run: |
          curl -s \
            -H "Title: ATP WTA Value Bet" \
            -H "Priority: default" \
            -H "Tags: tennis" \
            -H "Click: https://czakopeti.github.io/tennis/" \
            -d "Frissites kesz — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true
